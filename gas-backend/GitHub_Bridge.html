<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GAS GitHub Bridge</title>
</head>
<body>
<script>
(function () {
  "use strict";
  var PARENT_ORIGIN = <?!= parentOriginJson ?>;
  var NONCE = <?!= bridgeNonceJson ?>;
  var BRIDGE_VERSION = "github-pages-bridge-v1";
  var ALLOWED_FUNCTIONS = Object.freeze({
    apiRouter: true,
    apiLogin: true,
    apiSessionResume: true,
    apiSessionCheck: true,
    apiLogout: true,
    getDeferredInclude: true
  });
  var bridgePort = null;

  function hostWindow() {
    try {
      if (window.top && window.top !== window) return window.top;
    } catch (_ignoredTop) {}
    try { return window.parent || null; } catch (_ignoredParent) { return null; }
  }

  function safeError(error) {
    var message = "GAS bridge request failed";
    try { message = String(error && (error.message || error.error || error) || message); } catch (_ignored) {}
    return { message: message, code: String(error && (error.code || error.errorCode) || "GAS_BRIDGE_FAILED") };
  }

  function decorate(type, payload) {
    var message = payload || {};
    message.type = type;
    message.nonce = NONCE;
    message.bridgeVersion = BRIDGE_VERSION;
    return message;
  }

  function sendWindow(type, payload, transfer) {
    var target = hostWindow();
    if (!target) return false;
    try {
      target.postMessage(decorate(type, payload), PARENT_ORIGIN, transfer || []);
      return true;
    } catch (_ignoredTransfer) {
      try {
        target.postMessage(decorate(type, payload), PARENT_ORIGIN);
        return true;
      } catch (_ignoredPost) {
        return false;
      }
    }
  }

  function sendResult(payload) {
    var message = decorate("GAS_BRIDGE_RESULT", payload);
    if (bridgePort) {
      try { bridgePort.postMessage(message); return; } catch (_ignoredPort) {}
    }
    sendWindow("GAS_BRIDGE_RESULT", payload);
  }

  function handleCall(data) {
    data = data || {};
    if (data.type !== "GAS_BRIDGE_CALL" || data.nonce !== NONCE) return;
    var id = String(data.id || "");
    var fn = String(data.fn || "");
    if (!id || !ALLOWED_FUNCTIONS[fn]) {
      sendResult({ id: id, ok: false, error: { message: "Bridge function not allowed: " + fn, code: "GAS_BRIDGE_FN_DENIED" } });
      return;
    }
    try {
      var runner = google.script.run
        .withSuccessHandler(function (result) {
          sendResult({ id: id, ok: true, result: result });
        })
        .withFailureHandler(function (error) {
          sendResult({ id: id, ok: false, error: safeError(error) });
        });
      if (!runner || typeof runner[fn] !== "function") {
        sendResult({ id: id, ok: false, error: { message: "Server function not found: " + fn, code: "GAS_BRIDGE_FN_NOT_FOUND" } });
        return;
      }
      runner[fn](data.args == null ? {} : data.args);
    } catch (error) {
      sendResult({ id: id, ok: false, error: safeError(error) });
    }
  }

  /* Always keep the window-message listener as a compatibility path. */
  window.addEventListener("message", function (event) {
    if (event.origin !== PARENT_ORIGIN) return;
    handleCall(event.data || {});
  }, false);

  /* Preferred path: transferable MessagePort. Do not make readiness depend on
     a single transfer event; emit a non-transfer fallback READY as diagnosis. */
  var portReadySent = false;
  try {
    if (typeof MessageChannel === "function") {
      var channel = new MessageChannel();
      bridgePort = channel.port1;
      bridgePort.onmessage = function (event) { handleCall(event && event.data || {}); };
      if (bridgePort.start) bridgePort.start();
      portReadySent = sendWindow("GAS_BRIDGE_READY", { ok: true, channel: "message-port" }, [channel.port2]);
      if (!portReadySent) bridgePort = null;
    }
  } catch (_channelError) {
    bridgePort = null;
  }
  window.setTimeout(function () {
    sendWindow("GAS_BRIDGE_READY", { ok: true, channel: bridgePort ? "window-postmessage-fallback" : "window-postmessage" });
  }, portReadySent ? 180 : 0);
})();
</script>
